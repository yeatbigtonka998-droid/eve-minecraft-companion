plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'eve'

// eve-body's skill-provider API (eve.body.api), compiled against from body's sources and never packaged: at runtime the classes
// come from eve-body's own jar. ponytail: switch to body's published eve-body-api jar once it is committed.
sourceSets {
	bodyApi {
		java.srcDir "../body/src/api/java"
		compileClasspath += configurations.compileClasspath
	}
	main.compileClasspath += bodyApi.output
	test.compileClasspath += bodyApi.output
	test.runtimeClasspath += bodyApi.output
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
