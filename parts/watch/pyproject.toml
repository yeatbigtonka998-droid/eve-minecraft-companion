[project]
name = "eve_watch"
version = "0.1.0"
description = "Read-only live view of Eve's game window plus a board of her mind's state, served on the LAN"
requires-python = ">=3.12"
dependencies = ["Pillow>=10", "websockets>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eve_watch = ["index.html"]
